openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: worlds
    description: Saved Evoke worlds
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /worlds/{id}/feedback:
    put:
      operationId: saveWorldFeedback
      tags: [worlds]
      summary: Save or update the signed-in user's ratings for a ready world
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldFeedbackRatings"
      responses:
        "200":
          description: Saved ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldFeedbackResponse"
        "400": { description: Invalid ratings }
        "404": { description: World not found or not ready }
        "503": { description: Database unavailable }
components:
  schemas:
    WorldFeedbackRatings:
      type: object
      additionalProperties: false
      properties:
        happiness: { type: integer, minimum: 1, maximum: 3 }
        good_memories: { type: integer, minimum: 1, maximum: 3 }
        visual_memories: { type: integer, minimum: 1, maximum: 3 }
        music_memories: { type: integer, minimum: 1, maximum: 3 }
        return_interest: { type: integer, minimum: 1, maximum: 3 }
      required: [happiness, good_memories, visual_memories, music_memories, return_interest]
    WorldFeedback:
      allOf:
        - $ref: "#/components/schemas/WorldFeedbackRatings"
        - type: object
          properties:
            average: { type: number, minimum: 1, maximum: 3 }
          required: [average]
    WorldFeedbackResponse:
      type: object
      properties:
        feedback:
          $ref: "#/components/schemas/WorldFeedback"
      required: [feedback]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

